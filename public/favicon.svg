<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brand Gradient: AkuAda Purple to Radiant Pink -->
    <linearGradient id="akuadaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#akuadaGrad)" />
  <rect x="1" y="1" width="62" height="31" rx="14" fill="url(#topGlow)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35" />

  <!-- Bold Geometric "A" Emblem -->
  <path d="M32 11 L15 49 L23.5 49 L27.5 39.5 L36.5 39.5 L40.5 49 L49 49 Z M32 21.5 L35.2 33.5 L28.8 33.5 Z" fill="#ffffff" />

  <!-- Signature AkuAda Dot (.) -->
